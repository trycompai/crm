name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release pull request, tag and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: main
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Say what happened
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          URL: ${{ steps.release.outputs.html_url }}
        run: |
          set -euo pipefail
          if [ -n "${TAG:-}" ]; then
            echo "Released [$TAG]($URL) — merge the promotion pull request to put it on \`release\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No tag this run — either the release pull request is still open, or nothing releasable landed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on a merged release pull request that was never tagged
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          stuck=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state merged --label "autorelease: pending" --limit 1 --json number,title --jq '.[0] | select(.) | "#\(.number) \(.title)"')

          if [ -z "$stuck" ]; then
            exit 0
          fi

          {
            echo "**$stuck merged without a tag.** release-please aborts on it, so nothing releases and no release"
            echo "pull request opens until it is cleared: create the tag and GitHub Release at that pull request's"
            echo "merge commit, then swap its \`autorelease: pending\` label for \`autorelease: tagged\`."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1
